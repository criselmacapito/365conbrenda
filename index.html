  .sign{font-family:'Fraunces',serif;font-style:italic;color:var(--accent);margin-top:22px;font-size:18px}
  .date{margin-top:26px;font-size:14px;color:var(--soft)}

const DIA_MS = 86400000;
const meses = ['enero','febrero','marzo','abril','mayo','junio','julio','agosto','septiembre','octubre','noviembre','diciembre'];
const dias = ['domingo','lunes','martes','miércoles','jueves','viernes','sábado'];

function hoyLocal(){ const d=new Date(); return new Date(d.getFullYear(), d.getMonth(), d.getDate()); }
function indiceDe(fecha){ return Math.round((fecha - INICIO) / DIA_MS); }
const pad = n => String(n).padStart(2,'0');

const hoyIdx = Math.max(0, indiceDe(hoyLocal()));
let actual = hoyIdx;

const $ = id => document.getElementById(id);

function mostrar(idx, animar){
  const fecha = new Date(INICIO.getTime() + idx*DIA_MS);
  const clave = pad(fecha.getMonth()+1) + '-' + pad(fecha.getDate());
  const numero = (idx % 365) + 1;
  const texto = ESPECIALES[clave] || MENSAJES[idx % 365];
  const render = () => {
    $('msg').textContent = texto;
    $('dayNum').textContent = 'Día ' + numero;
    $('date').textContent = dias[fecha.getDay()] + ', ' + fecha.getDate() + ' de ' + meses[fecha.getMonth()] + ' de ' + fecha.getFullYear();
    $('bar').style.width = (numero/365*100) + '%';
    $('prev').disabled = idx <= 0;
    $('next').disabled = idx >= hoyIdx;   // no se pueden ver mensajes futuros
    $('today').disabled = idx === hoyIdx;
    $('msg').classList.remove('fade');
  };
  if(animar){ $('msg').classList.add('fade'); setTimeout(render, 300); } else render();
}

function cuentaRegresiva(){
  const ahora = new Date();
  const manana = new Date(ahora.getFullYear(), ahora.getMonth(), ahora.getDate()+1);
  const s = Math.floor((manana-ahora)/1000);
  const h = Math.floor(s/3600), m = Math.floor(s%3600/60);
  $('countdown').textContent = 'Próximo mensaje en ' + h + ' h ' + pad(m) + ' min';
  // Si cambió el día con la página abierta, recarga para mostrar el nuevo
  if(indiceDe(hoyLocal()) !== hoyIdx) location.reload();
}

$('prev').onclick = () => { if(actual>0){ actual--; mostrar(actual,true); } };
$('next').onclick = () => { if(actual<hoyIdx){ actual++; mostrar(actual,true); } };
$('today').onclick = () => { actual = hoyIdx; mostrar(actual,true); };

  s.style.animationDuration=(7+Math.random()*8)+'s';
  s.style.animationDelay=(Math.random()*10)+'s';

}
